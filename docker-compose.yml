services:
  mvg-departures:
    image: ghcr.io/skoelle/mvg-departures:latest
    container_name: mvg-departures
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Europe/Berlin
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
